[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routeros-acme-renew"
version = "0.2.0"
description = "Renew a Let's Encrypt certificate for a MikroTik RouterOS www-ssl service via DNS-01 (Route 53)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "acme>=5.9,<6",
    "josepy>=2",
    "boto3>=1.35",
    "paramiko>=3.4",
    "typer>=0.12",
    "pydantic>=2.6",
    "arrow>=1.3",
    "cryptography>=42",
]

[project.scripts]
routeros-acme-renew = "routeros_acme_renew.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/routeros_acme_renew"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
