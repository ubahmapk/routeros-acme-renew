[project]
name = "routeros-acme-renew"
version = "0.1.0"
description = "Renew a Let's Encrypt certificate for a MikroTik RouterOS www-ssl service via DNS-01 (Route 53)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Keep in sync with the inline script metadata at the top of routeros_acme_renew.py.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "arrow>=1.3",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
